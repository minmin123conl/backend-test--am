app = "exam-online-backend"
primary_region = "sin"

[build]

[env]
  EXAM_DB_PATH = "/data/exam.db"
  EXAM_UPLOAD_DIR = "/data/uploads"
  PORT = "8080"

[[mounts]]
  source = "exam_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
